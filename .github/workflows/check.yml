name: check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_daily:
        description: "Send tomorrow's schedule now (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest state.json at job start, not at event time
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -q
      - name: Check schedule and notify
        id: cloud
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_DAILY: ${{ inputs.force_daily && '1' || '0' }}
        run: python -m power.cloud
      - name: Save state
        if: always()
        run: |
          git add state.json
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: state"
          for delay in 5 10 20 40 60; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep "$delay"
          done
          exit 1
      - name: Fail if notifying failed
        if: steps.cloud.outcome == 'failure'
        run: exit 1
