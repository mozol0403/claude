name: keepalive

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit if the repo was quiet for 30 days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then echo "recent activity"; exit 0; fi
          date -u +%F > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "chore: keepalive"
          git push
